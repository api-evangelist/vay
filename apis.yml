name: Vay
description: 'Vay is a Berlin-headquartered teledriving (remote driving) mobility company,
  founded in 2018 by Thomas von der Ohe, Fabrizio Scelsi, and Bogdan Djukic, that operates
  the first commercial remotely driven car service. Customers in Las Vegas rent cars by
  the minute that are delivered and parked driverless by professional remote drivers from
  a Remote Driving Center; the company runs a 175-vehicle fleet, has served 50,000+ trips,
  and raised a Series C from Grab in December 2025. Vay is a consumer mobility service and
  does not publish a public developer API.'
